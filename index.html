    <meta name="theme-color" content="#0a0b12" />
    <meta name="color-scheme" content="dark light" />
    <!-- Apply the saved palette, light/dark mode and language before the first paint, so a light page never flashes dark
         (or the reverse) while the app loads. The settings store does the same thing afterwards and keeps it up to date. -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('aetheria_settings_v1') || 'null') || {};
          var html = document.documentElement;
          var dark = s.mode === 'dark' || (s.mode !== 'light' && !(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
          html.setAttribute('data-mode', dark ? 'dark' : 'light');
          if (s.theme) html.setAttribute('data-theme', s.theme);
          if (s.language === 'ar' || s.language === 'en') {
            html.lang = s.language;
            html.dir = s.language === 'ar' ? 'rtl' : 'ltr';
          }
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0a0b12' : '#f7f6fd');
        } catch (e) { /* storage blocked: the app sets everything once it starts */ }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aetheria" />
